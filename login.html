{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Sign in" %}{% endblock %}
{% block content %}
<div class="login-box"><div class="card"><div class="card-body p-4">
  <h1 class="h4 mb-3">{% trans "Sign in" %}</h1>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">{% trans "Incorrect email or password, or the account is temporarily locked." %}</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">{% trans "Email" %}</label>
      <input class="form-control" type="email" name="username" id="id_username" autofocus required autocomplete="username"></div>
    <div class="mb-3"><label class="form-label" for="id_password">{% trans "Password" %}</label>
      <input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100" type="submit">{% trans "Sign in" %}</button>
  </form>
</div></div></div>
{% endblock %}
