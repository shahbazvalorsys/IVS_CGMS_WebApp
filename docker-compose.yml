services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cgms
      POSTGRES_USER: cgms
      POSTGRES_PASSWORD: cgms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgms"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SSL_REDIRECT: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
volumes:
  pgdata:
