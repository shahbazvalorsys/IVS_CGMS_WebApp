name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cgms
          POSTGRES_USER: cgms
          POSTGRES_PASSWORD: cgms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cgms" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-key
      DATABASE_URL: postgres://cgms:cgms@localhost:5432/cgms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
